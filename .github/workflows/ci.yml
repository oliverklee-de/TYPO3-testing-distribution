---
name: CI
on:
  push:
jobs:
  php-lint:
    name: PHP linter
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "${{ matrix.php-version }}"
          ini-file: development
          coverage: none
          tools: composer:v2.6
      - name: Show Composer version
        run: composer --version
      - name: Show the Composer configuration
        run: composer config --global --list
      - name: Cache dependencies installed with composer
        uses: actions/cache@v6
        with:
          key: "php${{ matrix.php-version }}-composer-${{ hashFiles('**/composer.json') }}"
          path: ~/.cache/composer
          restore-keys: "php${{ matrix.php-version }}-composer-\n"
      - name: Install Composer dependencies
        run: "composer update --no-progress"
      - name: Run PHP lint
        run: "composer check:php:lint"
    strategy:
      fail-fast: false
      matrix:
        php-version:
          - '8.2'
          - '8.3'
          - '8.4'
          - '8.5'
  composer-validate:
    name: Composer validate
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "${{ matrix.php-version }}"
          ini-file: development
          coverage: none
          tools: composer:v2.6
      - name: Validate the composer.json
        run: "composer validate"
    strategy:
      fail-fast: false
      matrix:
        php-version:
          - '8.2'
          - '8.5'
  code-quality:
    name: Code quality checks
    runs-on: ubuntu-24.04
    needs: composer-validate
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "${{ matrix.php-version }}"
          ini-file: development
          coverage: none
          tools: composer:v2.6
      - name: Show Composer version
        run: composer --version
      - name: Show the Composer configuration
        run: composer config --global --list
      - name: Cache dependencies installed with composer
        uses: actions/cache@v6
        with:
          key: "php${{ matrix.php-version }}-composer-${{ hashFiles('**/composer.json') }}"
          path: ~/.cache/composer
          restore-keys: "php${{ matrix.php-version }}-composer-\n"
      - name: Install Composer dependencies
        run: "composer update --no-progress"
      - name: Run command
        run: "composer check:${{ matrix.command }}"
    strategy:
      fail-fast: false
      matrix:
        command:
          - composer:normalize
          - json:lint
          - yaml:lint
          - php:rector
          - php:cs-fixer
          - php:stan
          - typoscript:lint
        php-version:
          - '8.2'

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-24.04
    needs: [ php-lint ]
    strategy:
      matrix:
        php-version:
          - '8.2'
          - '8.5'
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "${{ matrix.php-version }}"
          ini-file: development
          coverage: none
          tools: composer:v2.6
      - name: Show Composer version
        run: composer --version
      - name: Show the Composer configuration
        run: composer config --global --list
      - name: Cache dependencies installed with composer
        uses: actions/cache@v6
        with:
          key: "php${{ matrix.php-version }}-composer-${{ hashFiles('**/composer.json') }}"
          path: ~/.cache/composer
          restore-keys: "php${{ matrix.php-version }}-composer-\n"
      - name: Install Composer dependencies
        run: "composer update --no-progress"
      - name: Run the tests
        run: "composer check:tests:unit"

  functional-tests:
    name: Functional Tests
    runs-on: ubuntu-24.04
    needs: [ php-lint, composer-validate ]
    strategy:
      matrix:
        php-version:
          - '8.2'
          - '8.5'
    env:
      DB_DATABASE: typo3
      DB_USER: root
      DB_PASSWORD: root
      DB_HOST: 127.0.0.1

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "${{ matrix.php-version }}"
          ini-file: development
          coverage: none
          tools: composer:v2.6
      - name: Show Composer version
        run: composer --version
      - name: Show the Composer configuration
        run: composer config --global --list
      - name: Cache dependencies installed with composer
        uses: actions/cache@v6
        with:
          key: "php${{ matrix.php-version }}-composer-${{ hashFiles('**/composer.json') }}"
          path: ~/.cache/composer
          restore-keys: "php${{ matrix.php-version }}-composer-\n"
      - name: Install Composer dependencies
        run: "composer update --no-progress"
      - name: Start MySQL
        run: "sudo /etc/init.d/mysql start"
      - name: Install GraphicsMagick
        run: |
          sudo apt-get --quiet update
          sudo apt-get --quiet --yes --no-install-recommends install graphicsmagick
      - name: Run the tests
        run: |
          export typo3DatabaseName="$DB_DATABASE";
          export typo3DatabaseHost="$DB_HOST";
          export typo3DatabaseUsername="$DB_USER";
          export typo3DatabasePassword="$DB_PASSWORD";
          composer check:tests:functional
